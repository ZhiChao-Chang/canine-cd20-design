name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: cd20-design reproduce --output /tmp/cd20-reproduced
      - run: cd20-design reproduce-diagnostics --output /tmp/cd20-diagnostics
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: python3 scripts/build_site.py --output /tmp/cd20-index.html
